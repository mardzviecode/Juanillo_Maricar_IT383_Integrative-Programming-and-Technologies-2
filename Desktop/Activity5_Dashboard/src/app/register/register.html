<div class="body">
  <div class="login-card">
    <div class="logo-row">
      <div class="logo-badge">
        <img src="/cat.png" alt="App logo" class="logo-image" />
      </div>
      <div class="logo-text">
        <span class="logo-name">Cat Shop</span>
        <span class="logo-tagline">Create your account</span>
      </div>
    </div>

    <h1 class="title">Register</h1>
    <p class="subtitle">Sign up to start shopping.</p>

    <form (ngSubmit)="submit()" #registerForm="ngForm" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          placeholder="Choose a username"
          class="text-input"
          [(ngModel)]="username"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="you@example.com"
          class="text-input"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Create a password"
          class="text-input"
          [(ngModel)]="password"
          required
        />
      </div>

      <button class="primary-button" type="submit" [disabled]="registerForm.invalid">
        Create account
      </button>
    </form>

    <p class="auth-footer">
      <span>Already have an account?</span>
      <button type="button" class="link-button" (click)="backToLogin()">Back to login</button>
    </p>

    <table *ngIf="users.length" class="users-table">
      <thead>
        <tr>
          <th>Username</th>
          <th>Email</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of users">
          <td>{{ u.username }}</td>
          <td>{{ u.email }}</td>
        </tr>
      </tbody>
    </table>

    <p class="result error" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>
    <p class="result success" *ngIf="registrationSuccess">
      Registration successful
    </p>
  </div>
</div>
